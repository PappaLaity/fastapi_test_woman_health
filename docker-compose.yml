services:
  fastapi:
    build: .
    container_name: fastapi_women_health
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      LLM_PROVIDER: "ollama"
    networks:
      - ai_network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/init.sh:/init.sh
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - ai_network
    restart: unless-stopped

networks:
  ai_network:

volumes:
  ollama_data:
